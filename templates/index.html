<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PDF Parser - Inicio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .error { color: white; background: #e74c3c; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Subir Extracto (PDF)</h1>
        
        {% if error %}
            <div class="error">
                <strong>Error:</strong> {{ error }}
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="pdf" accept=".pdf" required style="margin-bottom: 20px; display: block;">
            <button type="submit">Procesar Documento</button>
        </form>
    </div>
</body>
</html>
